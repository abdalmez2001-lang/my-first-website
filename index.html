<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر قيم زون</title>
    
    <style>
        body {
            background: linear-gradient(135deg, #0a1930 0%, #1a3b6e 100%); /* خلفية داكنة تناسب الشعار */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            animation: fadeIn 1.5s ease-in-out;
        }

        /* تنسيق صورة الشعار */
        .logo-img {
            width: 250px; /* عرض الشعار */
            height: auto;
            border-radius: 50%; /* لجعل الشعار دائرياً (إذا كانت الصورة مربعة) */
            margin-bottom: 20px;
        }

        h1 {
            color: #1a3b6e;
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #666;
            font-size: 16px;
        }

        /* تنسيق زر الواتساب */
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background-color: #25D366; /* لون الواتساب الأخضر */
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05); /* تكبير الزر قليلاً عند التمرير */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- تأكد أن اسم الصورة هنا يطابق اسم الملف الذي رفعته -->
        <img src="logo.png" alt="شعار متجر قيم زون" class="logo-img">
        
        <h1>متجر قيم زون</h1>
        <p>أهلاً بك في متجرنا! تواصل معنا مباشرة للطلب والاستفسار.</p>
        
        <!-- وضع رقم الواتساب في الزر -->
        <a href="https://wa.me/249994810126" class="btn" target="_blank">تواصل معنا على واتساب</a>
    </div>

</body>
</html>
