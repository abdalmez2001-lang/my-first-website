<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الأول</title>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            /* إضافة تأثير حركي لظهور الصندوق */
            animation: fadeIn 1.5s ease-in-out;
        }

        /* تنسيق الصورة */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%; /* لجعل الصورة دائرية */
            object-fit: cover;
            border: 4px solid #764ba2; /* إطار بنفسجي حول الصورة */
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #764ba2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #5a3782;
        }

        /* تعريف التأثير الحركي */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ضع اسم صورتك هنا بدلاً من profile.jpg -->
        <img src="profile.jpg" alt="صورتي الشخصية" class="profile-img">
        
        <h1>مرحباً بك في موقعي الأول!</h1>
        <p>تم إنشاء هذا الموقع بنجاح باستخدام GitHub Pages، وتم تنسيقه باستخدام CSS مع إضافة صورة وتأثير حركي.</p>
        <a href="https://github.com" class="btn" target="_blank">زيارة حسابي</a>
    </div>

</body>
</html>
