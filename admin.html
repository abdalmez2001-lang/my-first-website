<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم قيم زون</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; color: white; padding: 20px; }
        .container { max-width: 600px; margin: auto; background-color: #1e293b; padding: 30px; border-radius: 15px; }
        h1 { color: #3b82f6; text-align: center; }
        label { display: block; margin-top: 15px; color: #cbd5e1; }
        input { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 25px; background-color: #25D366; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #1ebe56; }
        textarea { width: 100%; height: 200px; margin-top: 20px; background-color: #000; color: #25D366; padding: 10px; border-radius: 8px; font-family: monospace; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>تعديل باقات ببجي</h1>
    
    <label>الباقة 1:</label>
    <input type="text" id="p1" value="660 شدة">
    <input type="text" id="s1" value="10,000 ج.س">

    <label>الباقة 2:</label>
    <input type="text" id="p2" value="1800 شدة">
    <input type="text" id="s2" value="25,000 ج.س">

    <label>الباقة 3:</label>
    <input type="text" id="p3" value="3850 شدة">
    <input type="text" id="s3" value="50,000 ج.س">

    <button onclick="generate()">توليد كود التحديث</button>
    
    <textarea id="result" readonly onclick="this.select()"></textarea>
</div>

<script>
    function generate() {
        const p1 = document.getElementById('p1').value;
        const s1 = document.getElementById('s1').value;
        const p2 = document.getElementById('p2').value;
        const s2 = document.getElementById('s2').value;
        const p3 = document.getElementById('p3').value;
        const s3 = document.getElementById('s3').value;

        const code = `<!-- باقات ببجي المحدثة -->
<div id="pubgModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('pubgModal')">&times;</span>
        <h2>باقات ببجي (PUBG UC)</h2>
        <ul class="package-list">
            <li>${p1} <span>${s1}</span></li>
            <li>${p2} <span>${s2}</span></li>
            <li>${p3} <span>${s3}</span></li>
        </ul>
        <a href="https://wa.me/249994810126?text=أريد%20شحن%20ببجي" class="whatsapp-btn" style="padding: 10px 20px; font-size: 16px; margin-bottom:0;">اطلب عبر واتساب</a>
    </div>
</div>`;
        
        const resBox = document.getElementById('result');
        resBox.value = code;
        resBox.style.display = 'block';
    }
</script>
</body>
</html>
