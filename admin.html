<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم متجر قيم زون</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; color: white; padding: 20px; }
        .container { max-width: 800px; margin: auto; background-color: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #3b82f6; text-align: center; }
        h2 { color: #25D366; margin-top: 30px; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        label { display: block; margin-top: 10px; color: #cbd5e1; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #334155; background-color: #0f172a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; background-color: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #2563eb; }
        textarea { width: 100%; height: 200px; margin-top: 20px; background-color: #0f172a; color: #25D366; padding: 10px; border-radius: 8px; border: 1px solid #334155; font-family: monospace; font-size: 12px; display: none; }
        .success-msg { color: #25D366; text-align: center; display: none; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚙️ لوحة تحكم قيم زون</h1>
    <p style="text-align:center; color:#94a3b8;">اختر اللعبة، عدل الباقات، ثم انسخ الكود إلى موقعك.</p>

    <!-- اختيار اللعبة -->
    <label>اختر اللعبة لتعديل باقاتها:</label>
    <select id="gameSelect" onchange="loadGameData()">
        <option value="pubg">ببجي موبايل (PUBG)</option>
        <option value="freefire">فري فاير (Free Fire)</option>
        <option value="cod">كول أوف ديوتي (COD)</option>
    </select>

    <!-- حقول الباقات الثلاثة -->
    <h2>الباقات والأسعار</h2>
    
    <label>الباقة الأولى (مثال: 660 شدة)</label>
    <input type="text" id="pkg1_name" placeholder="اسم الباقة...">
    <label>سعر الباقة الأولى (مثال: 10,000 ج.س)</label>
    <input type="text" id="pkg1_price" placeholder="السعر...">

    <label>الباقة الثانية (مثال: 1800 شدة)</label>
    <input type="text" id="pkg2_name" placeholder="اسم الباقة...">
    <label>سعر الباقة الثانية</label>
    <input type="text" id="pkg2_price" placeholder="السعر...">

    <label>الباقة الثالثة (مثال: 3850 شدة)</label>
    <input type="text" id="pkg3_name" placeholder="اسم الباقة...">
    <label>سعر الباقة الثالثة</label>
    <input type="text" id="pkg3_price" placeholder="السعر...">

    <button onclick="generateCode()">توليد الكود الجديد</button>
    <div class="success-msg" id="successMsg">✅ تم توليد الكود بنجاح! انسخه من الأسفل.</div>
    
    <!-- مربع عرض الكود -->
    <textarea id="outputCode" readonly onclick="this.select()"></textarea>
</div>

<script>
    // بيانات افتراضية مبدئية (يتم حفظها مؤقتاً في المتصفح)
    let gameData = {
        pubg: { p1: "660 شدة", s1: "10,000 ج.س", p2: "1800 شدة", s2: "25,000 ج.س", p3: "3850 شدة", s3: "50,000 ج.س", text: "ببجي" },
        freefire: { p1: "100 جوهرة", s1: "5,000 ج.س", p2: "310 جوهرة", s2: "12,000 ج.س", p3: "520 جوهرة", s3: "20,000 ج.س", text: "فري فاير" },
        cod: { p1: "400 نقطة", s1: "15,000 ج.س", p2: "800 نقطة", s2: "28,000 ج.س", p3: "2000 نقطة", s3: "65,000 ج.س", text: "كول اوف ديوتي" }
    };

    function loadGameData() {
        const game = document.getElementById('gameSelect').value;
        const data = gameData[game];
        
        document.getElementById('pkg1_name').value = data.p1;
        document.getElementById('pkg1_price').value = data.s1;
        document.getElementById('pkg2_name').value = data.p2;
        document.getElementById('pkg2_price').value = data.s2;
        document.getElementById('pkg3_name').value = data.p3;
        document.getElementById('pkg3_price').value = data.s3;
        
        document.getElementById('outputCode').style.display = 'none';
        document.getElementById('successMsg').style.display = 'none';
    }

    function generateCode() {
        const game = document.getElementById('gameSelect').value;
        const gameTitle = gameData[game].text;
        
        const p1 = document.getElementById('pkg1_name').value;
        const s1 = document.getElementById('pkg1_price').value;
        const p2 = document.getElementById('pkg2_name').value;
        const s2 = document.getElementById('pkg2_price').value;
        const p3 = document.getElementById('pkg3_name').value;
        const s3 = document.getElementById('pkg3_price').value;

        // تحديث البيانات في الذاكرة
        gameData[game] = { p1, s1, p2, s2, p3, s3, text: gameTitle };

        // بناء كود HTML الجديد
        const htmlCode = `
<!-- تعديل باقات ${gameTitle} -->
<div id="${game}Modal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal('${game}Modal')">&times;</span>
        <h2>باقات ${gameTitle}</h2>
        <ul class="package-list">
            <li>${p1} <span>${s1}</span></li>
            <li>${p2} <span>${s2}</span></li>
            <li>${p3} <span>${s3}</span></li>
        </ul>
        <a href="https://wa.me/249994810126?text=مرحباً،%20أريد%20شحن%20${encodeURIComponent(gameTitle)}" class="whatsapp-btn" style="padding: 10px 20px; font-size: 16px; margin-bottom:0;">اطلب هذه الباقة واتساب</a>
    </div>
</div>
        `;

        // عرض الكود في المربع
        const output = document.getElementById('outputCode');
        output.value = htmlCode;
        output.style.display = 'block';
        
        document.getElementById('successMsg').style.display = 'block';
    }

    // تحميل بيانات ببجي افتراضياً عند فتح الصفحة
    window.onload = loadGameData;
</script>

</body>
</html>
